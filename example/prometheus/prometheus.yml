global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  ### monitor market
  - job_name: polymarket-market
    metrics_path: /probe
    scrape_interval: 5m
    scrape_timeout: 60s
    static_configs:
      - targets:
          - will-jesus-christ-return-before-2027          # https://polymarket.com/event/will-jesus-christ-return-before-2027
          - will-china-invade-taiwan-by-december-31-2027  # https://polymarket.com/event/will-china-invade-taiwan-by-december-31-2027
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: polymarket-exporter:9184

  ### monitor wallet address
  - job_name: polymarket-wallet
    metrics_path: /probe
    scrape_interval: 5m
    scrape_timeout: 60s
    static_configs:
      - targets:
          - "0x2dD2C8233E02F5636b490323a8CdF3CDc4eEd5d8" # change to your address
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __param_module
        replacement: wallet
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: polymarket-exporter:9184

  # Internal exporter health metrics
  - job_name: polymarket-exporter
    static_configs:
      - targets: ["polymarket-exporter:9184"]
    metrics_path: /metrics

# Alert rules for polymarket gauge metrics.
#
# All polymarket_* metrics are GAUGES, not counters.
# - rate() is for counters only — do NOT use it on gauges.
# - delta()   → raw difference over a time window (catches sudden jumps)
# - deriv()   → per-second derivative of a gauge (catches sustained drift)
# - changes() → number of value transitions (catches volatility)

groups:
### Market monitoring
  - name: polymarket_market_alerts
    rules:
      # Fires when price moves more than 5 cents in either direction within 15 minutes.
      - alert: MarketLargePriceMovement
        expr: abs(delta(polymarket_market_last_trade_price[15m])) > 0.05
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Large price movement on {{ $labels.question }}"
          description: >-
            Outcome "{{ $labels.outcome }}" moved by
            {{ $value | printf "%.4f" }} in the last 15 minutes.

      # Fires when bid-ask spread exceeds 2 ticks for 5 minutes.
      # Normalises by tick_size so the threshold works across markets
      # (e.g. 0.01-cent and 0.1-cent tick sizes).
      - alert: MarketWideSpread
        expr: (polymarket_market_spread / polymarket_market_tick_size) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Wide spread on {{ $labels.question }}"
          description: >-
            Outcome "{{ $labels.outcome }}" spread is
            {{ $value | printf "%.0f" }} ticks (threshold: 2).

      # Fires on large open interest swing (>$100k in 15 minutes).
      - alert: MarketLargeOpenInterestChange
        expr: abs(delta(polymarket_market_open_interest[15m])) > 100000
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "Large OI change on {{ $labels.question }}"
          description: >-
            Open interest changed by {{ $value | printf "%.0f" }}
            in the last 15 minutes.

      # Fires when the price value changes more than 20 times in 5 minutes.
      - alert: MarketHighVolatility
        expr: changes(polymarket_market_last_trade_price[5m]) > 20
        for: 2m
        labels:
          severity: info
        annotations:
          summary: "High volatility on {{ $labels.question }}"
          description: >-
            Outcome "{{ $labels.outcome }}" price changed
            {{ $value | printf "%.0f" }} times in the last 5 minutes.

      # Fires when price drifts steadily for 5+ minutes.
      - alert: MarketSustainedPriceDrift
        expr: abs(deriv(polymarket_market_last_trade_price[10m])) > 0.001
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Sustained price drift on {{ $labels.question }}"
          description: >-
            Outcome "{{ $labels.outcome }}" drifting at
            {{ $value | printf "%.6f" }} per second over 10 minutes.

### Wallet address monitoring
  - name: polymarket_wallet_alerts
    rules:
      # Fires when a position price changes by 5 cents in either direction within 15 minutes.
      - alert: WalletLargePositionPriceMovement
        expr: abs(delta(polymarket_wallet_position_current_price[15m])) > 0.05
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Large position price movement for {{ $labels.wallet }}"
          description: >-
            {{ $labels.question }} ({{ $labels.outcome }}) moved by
            {{ $value | printf "%.4f" }} in the last 15 minutes.

      # Fires when a position price falls by more than 5 cents within 15 minutes.
      - alert: WalletLargePositionPriceDownside
        expr: -delta(polymarket_wallet_position_current_price[15m]) > 0.05
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Large position price drop for {{ $labels.wallet }}"
          description: >-
            {{ $labels.question }} ({{ $labels.outcome }}) fell by
            {{ $value | printf "%.4f" }} in the last 15 minutes.

      # Fires while an unresolved position has lost its entire value.
      - alert: WalletPositionLostAllValue
        expr: polymarket_wallet_position_current_value_usdc == 0 and polymarket_wallet_position_traded_usdc > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Position lost all value for {{ $labels.wallet }}"
          description: >-
            {{ $labels.question }} ({{ $labels.outcome }}) has no current value
            despite a positive initial trade.

      # Fires when an open wallet position's market has a spread wider than 2 ticks for 5 minutes.
      - alert: WalletMarketWideSpread
        expr: (polymarket_wallet_position_shares > 0) and on (question, outcome, token_id) ((polymarket_market_spread / polymarket_market_tick_size) > 2)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Wide market spread for {{ $labels.wallet }}"
          description: >-
            {{ $labels.question }} ({{ $labels.outcome }}) has a spread wider
            than 2 ticks.

      # Fires when open interest changes by more than $100k on a wallet's market.
      - alert: WalletMarketLargeOpenInterestChange
        expr: (polymarket_wallet_position_shares > 0) and on (condition_id) (abs(delta(polymarket_market_open_interest[15m])) > 100000)
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "Large open-interest change for {{ $labels.wallet }}"
          description: >-
            {{ $labels.question }} ({{ $labels.outcome }}) has open-interest
            movement above 100,000 USDC in 15 minutes.

      # Fires when a wallet's market price changes more than 20 times in 5 minutes.
      - alert: WalletMarketHighVolatility
        expr: (polymarket_wallet_position_shares > 0) and on (question, outcome, token_id) (changes(polymarket_market_last_trade_price[5m]) > 20)
        for: 2m
        labels:
          severity: info
        annotations:
          summary: "High market volatility for {{ $labels.wallet }}"
          description: >-
            {{ $labels.question }} ({{ $labels.outcome }}) changed price more
            than 20 times in 5 minutes.

      # Fires when a wallet's market price drifts steadily for 5 minutes.
      - alert: WalletMarketSustainedPriceDrift
        expr: (polymarket_wallet_position_shares > 0) and on (question, outcome, token_id) (abs(deriv(polymarket_market_last_trade_price[10m])) > 0.001)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Sustained market price drift for {{ $labels.wallet }}"
          description: >-
            {{ $labels.question }} ({{ $labels.outcome }}) is drifting faster
            than 0.001 per second.

      # Fires when cash P&L drops by more than $100 within 6 hours.
      - alert: WalletLargePositionCashLoss
        expr: -delta(polymarket_wallet_position_cash_pnl_usdc[6h]) > 100
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Large cash loss for {{ $labels.wallet }}"
          description: >-
            {{ $labels.question }} ({{ $labels.outcome }}) cash P&L fell by
            {{ $value | printf "%.2f" }} USDC in 6 hours.
            (condition: loss > 100 USDC in 6 hours).

      # Fires when P&L drops by more than 10 percentage points within 6 hours.
      - alert: WalletLargePositionPercentageLoss
        expr: -delta(polymarket_wallet_position_pnl_ratio[6h]) * 100 > 10
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Large percentage loss for {{ $labels.wallet }}"
          description: >-
            {{ $labels.question }} ({{ $labels.outcome }}) P&L fell by
            {{ $value | printf "%.2f" }} percentage points in 6 hours.
            (condition: loss > 10 percentage points in 6 hours).

      - alert: WalletProbeFailing
        expr: up{job="polymarket-wallet"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Wallet probe failing for {{ $labels.instance }}"
          description: >-
            The wallet metrics scrape has failed for 2 minutes.


### Exporter alerts
  - name: polymarket_exporter_health
    rules:
      - alert: ExporterMarketProbeFailing
        expr: up{job="polymarket-market"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Polymarket probe failing for {{ $labels.instance }}"
          description: >-
            Scrape target {{ $labels.instance }} has been down for 2 minutes.

      - alert: ExporterWebSocketDisconnected
        expr: polymarket_exporter_websocket_connected == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "WebSocket disconnected"
          description: >-
            The exporter WebSocket has been disconnected for 5 minutes.
